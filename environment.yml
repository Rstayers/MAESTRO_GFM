name: maestro-gfm
channels:
  - pytorch
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip

  # Base scientific stack
  - numpy==1.26.4
  - pandas==2.2.2
  - scipy==1.13.1
  - scikit-learn==1.7.2
  - networkx==3.3
  - matplotlib=3.8  # 3.9 does not exist on Windows conda

  # PyTorch CPU (cleanest & guaranteed compatible)
  - pytorch==2.3.1
  - cpuonly
  - peft
  # pip-installed packages (PyG, DGL, scatter/sparse)
  - pip:
      # PyTorch Geometric (Windows: pip only)
      - torch-geometric==2.5.3

      # PyG dependencies (compiled wheels exist for Win+PyTorch 2.3)
      - torch-scatter==2.1.2
      - torch-sparse==0.6.18

      # DGL (Windows: pip only)
      - dgl==1.1.2

      # Transformers
      - transformers>=4.15
